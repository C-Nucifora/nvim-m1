name: Propose bundled toolchain updates

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

# A PAT creates the branch/PR so the normal pull_request checks run. No merge
# or extension publishing is performed by this workflow.
permissions:
  contents: read

concurrency:
  group: bundled-toolchain-proposals
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Require proposal credentials
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure GH_PAT with repository contents/pull-request write access; its pushes must trigger normal PR CI."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Validate update resolver
        run: python3 scripts/test-sync-toolchain.py
      - name: Resolve complete published releases
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          python3 scripts/sync-toolchain.py --apply > "$RUNNER_TEMP/toolchain.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ["RUNNER_TEMP"], "toolchain.json").read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("changed=" + str(data["changed"]).lower() + "\n")
          if data["changed"]:
              body = "Updates the bundled tools to complete, stable published releases and bumps the plugin version to v" + data["version"] + ".\n\n"
              body += "\n".join("- " + tool + ": " + version for tool, version in data["versions"].items())
              body += "\n\nAll supported binary assets and SHA256SUMS entries were checked, including native asset digests when present. Normal CI, review and approval are required; nothing auto-merges. Merging triggers the existing VERSION release workflow."
              Path(os.environ["RUNNER_TEMP"], "toolchain-pr.md").write_text(body)
          PY
      - name: Open or refresh proposal
        if: steps.resolve.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          branch="sync/bundled-toolchain"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Repeated daily runs must not dismiss approvals by pushing another
          # commit containing the same pins. Only replace our proposal branch,
          # and use an explicit lease to detect edits after the comparison.
          expected=""
          unchanged="false"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            expected=$(git rev-parse "refs/remotes/origin/$branch")
            if git diff --quiet "refs/remotes/origin/$branch" -- VERSION lua/nvim-m1/install.lua; then
              unchanged="true"
            fi
          fi
          if [ "$unchanged" != "true" ]; then
            git checkout -b "$branch"
            git add VERSION lua/nvim-m1/install.lua
            git commit -m "chore: update bundled M1 toolchain"
            git push --force-with-lease="refs/heads/$branch:$expected" origin "HEAD:refs/heads/$branch"
          fi
          state=$(gh pr view "$branch" --json state -q .state 2>/dev/null || true)
          if [ "$state" = "OPEN" ]; then
            gh pr edit "$branch" --title "chore: update bundled M1 toolchain" \
              --body-file "$RUNNER_TEMP/toolchain-pr.md"
          else
            gh pr create --base main --head "$branch" \
              --title "chore: update bundled M1 toolchain" \
              --body-file "$RUNNER_TEMP/toolchain-pr.md"
          fi
